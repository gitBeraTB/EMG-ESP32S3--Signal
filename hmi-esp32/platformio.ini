; PlatformIO Project Configuration File
;
; Mod main.cpp icindeki #define ile secilir:
;   MODE_COLLECT    -> veri toplama (Serial CSV)
;   MODE_INFERENCE  -> tahmin + ESP-NOW + UART (STM32)

[platformio]
src_dir = ..

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<main.cpp>

; N8R8 varyanti: 8MB Flash + 8MB embedded PSRAM (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Native USB (USB-Serial/JTAG) uzerinden Serial console
; Bu flag olmadan Serial UART0'a (GPIO 43/44) gider; native USB'de gorunmez.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
